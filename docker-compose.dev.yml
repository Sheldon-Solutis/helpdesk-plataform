# Override pra rodar a partir do código-fonte em vez de puxar do GHCR.
# Assume os 5 repos clonados como irmãos deste (helpdesk-platform):
#
#   dev/
#     helpdesk-platform/           <- você está aqui
#     helpdesk-user-service/
#     helpdesk-ticket-service/
#     helpdesk-notification-service/
#     helpdesk-api-gateway/
#     helpdesk-frontend/
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  user-service:
    build:
      context: ../helpdesk-user-service

  ticket-service:
    build:
      context: ../helpdesk-ticket-service

  notification-service:
    build:
      context: ../helpdesk-notification-service

  api-gateway:
    build:
      context: ../helpdesk-api-gateway

  frontend:
    build:
      context: ../helpdesk-frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080/api
